# Local development: hot-reload Django. Database comes from .env (DATABASE_URL, e.g. Supabase);
# without it the app falls back to SQLite stored in this folder.
#   ./start.sh dev
services:
  api:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_DEBUG: "1"
      IN_DOCKER: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    ports:
      - "${PORT:-8765}:8000"
