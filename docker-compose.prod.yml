# Production: gunicorn against Supabase Postgres (no local DB).
#   ./start.sh prod
# Requires .env with DJANGO_SECRET_KEY, DJANGO_ALLOWED_HOSTS, DATABASE_URL, CORS_ALLOWED_ORIGINS, CSRF_TRUSTED_ORIGINS.
services:
  api:
    build: .
    env_file: .env
    environment:
      DJANGO_DEBUG: "0"
      IN_DOCKER: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/products/?page=1', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
